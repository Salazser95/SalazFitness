# nginx delante de todo: sirve la PWA y pasa la API al backend.
#
# Es lo que permite que la app y la API compartan origen desde el navegador
# (nada de CORS) y que el APK apunte a un solo dominio.
#
# Para HTTPS, lo mas comodo es poner Caddy o un certbot delante -- o el tunel
# de Cloudflare (ver docs/ACCESO-REMOTO.md), que ya entrega https real sin
# tocar nada aqui. Este fichero se queda en http y confia en la cabecera
# X-Forwarded-Proto que le llegue de ese proxy.

# Este fichero nunca termina TLS (mas abajo solo hay "listen 80"), asi que la
# variable $scheme de nginx vale siempre "http", entre el visitante como
# entre. Si delante hay un proxy que SI sabe el esquema real (Caddy, o
# cloudflared con el tunel) y ya manda X-Forwarded-Proto, hay que reenviar
# ese valor tal cual en vez de pisarlo con $scheme: pisarlo es lo que rompe
# el tunel, porque entonces Django siempre ve "http" y con
# SALAZ_FORCE_HTTPS=1 redirige a https en cada peticion, esa peticion vuelve
# a llegar aqui otra vez como http (el tunel tambien habla http con nginx) y
# vuelve a redirigir: un bucle que no para nunca. $scheme solo se usa como
# ultimo recurso, cuando no llega ninguna cabecera (alguien entra
# directamente al puerto 80 de nginx, sin proxy delante).
map $http_x_forwarded_proto $salaz_esquema {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Las fotos de recetas y de progreso pueden ser grandes.
    client_max_body_size 25M;

    # ------------------------------------------------------------ streaming
    # GET /api/v2/salaz/events/ devuelve text/event-stream (Server-Sent
    # Events): una conexion que se queda abierta y va mandando datos poco a
    # poco. nginx por defecto BUFEA la respuesta del backend hasta tener un
    # trozo grande o que se cierre la conexion, asi que sin este location
    # aparte el navegador no veria nada hasta que el stream terminara -- en
    # la practica, nunca llegaria nada. location = hace coincidencia exacta y
    # nginx ya la prioriza sobre la regular de abajo aunque estuviera despues,
    # pero se deja aqui delante para que sea facil de encontrar.
    location = /api/v2/salaz/events/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $salaz_esquema;
        # Lo que hace falta para que el stream llegue de verdad:
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # --------------------------------------------------------------- backend
    # /api    la API REST (wger + salaz)
    # /allauth  el login, que no esta bajo /api
    location ~ ^/(api|allauth|django-admin|static/admin) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sin esto Django cree que la peticion vino por http y redirige a http
        # aunque el usuario haya entrado por https. $salaz_esquema respeta el
        # valor que ya trae la peticion en vez de pisarlo (ver el comentario
        # grande al principio del fichero).
        proxy_set_header X-Forwarded-Proto $salaz_esquema;
        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /srv/salaz/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/salaz/media/;
        expires 7d;
    }

    # ------------------------------------------------------------------ PWA
    location / {
        root /usr/share/nginx/html;
        # La app es de una sola pagina: cualquier ruta desconocida
        # (/verificar, /compra/lista...) la resuelve React Router.
        try_files $uri $uri/ /index.html;
    }

    # El service worker no se puede cachear o la app se queda pillada en una
    # version vieja para siempre.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
