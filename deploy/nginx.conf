# nginx delante de todo: sirve la PWA y pasa la API al backend.
#
# Es lo que permite que la app y la API compartan origen desde el navegador
# (nada de CORS) y que el APK apunte a un solo dominio.
#
# Para HTTPS, lo mas comodo es poner Caddy o un certbot delante; este fichero
# se queda en http y confia en la cabecera X-Forwarded-Proto que le llegue.

server {
    listen 80;
    server_name _;

    # Las fotos de recetas y de progreso pueden ser grandes.
    client_max_body_size 25M;

    # --------------------------------------------------------------- backend
    # /api    la API REST (wger + salaz)
    # /allauth  el login, que no esta bajo /api
    location ~ ^/(api|allauth|django-admin|static/admin) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sin esto Django cree que la peticion vino por http y redirige a http
        # aunque el usuario haya entrado por https.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /srv/salaz/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/salaz/media/;
        expires 7d;
    }

    # ------------------------------------------------------------------ PWA
    location / {
        root /usr/share/nginx/html;
        # La app es de una sola pagina: cualquier ruta desconocida
        # (/verificar, /compra/lista...) la resuelve React Router.
        try_files $uri $uri/ /index.html;
    }

    # El service worker no se puede cachear o la app se queda pillada en una
    # version vieja para siempre.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
